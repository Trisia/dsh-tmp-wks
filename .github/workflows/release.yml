name: Release

# 打 v* tag 时触发：构建 -> 发布 npm -> 创建 GitHub Release。
on:
  push:
    tags: [ 'v*' ]

# contents: write 用于创建 GitHub Release。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 插件以 dist/ 作为发布单元，构建后再打包，确保产物与源码一致。
      - name: Build
        run: npm run build

      # 只校验 dist 非空且至少含两个入口，不枚举具体文件：新增产物时无需改这里。
      - name: Verify build output
        run: |
          set -euo pipefail
          test -d dist || { echo "dist/ was not produced"; exit 1; }
          count=$(find dist -type f | wc -l)
          test "$count" -gt 0 || { echo "dist/ is empty"; exit 1; }
          find dist -type f -empty -print -quit | grep -q . && { echo "dist/ contains empty files"; exit 1; }
          for entry in dist/index.js dist/client.js; do
            test -s "$entry" || { echo "missing entry point: $entry"; exit 1; }
          done
          echo "dist/ contains $count file(s):"
          find dist -type f | sort

      # 打包 dist 全部内容，外加仓库根的说明与许可证。
      - name: Package tarball
        run: mkdir -p artifacts && tar -czf artifacts/dsh-tmp-wks.tar.gz dist README.md README.zh.md LICENSE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.tar.gz

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    # 需要在仓库中配置 environment: RELEASE_CI 并写入 NPM_TOKEN。
    environment: RELEASE_CI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # package.json 的 files 只含 dist，prepublishOnly 未配置，故此处不重复构建。
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取完整历史，供下面的变更清单按上一个 tag 生成。
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      # 用固定模板拼出 Release 说明，不改用 generate_release_notes：
      # 原生自动生成只统计 PR，本仓库直接推送 main，模板更可控且直接给出安装命令。
      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo '')

          {
            echo "从 DSH 侧边栏一键创建临时工作区并直接开始会话，删除时可选是否清理磁盘上的临时目录。"
            echo
            echo "## 安装"
            echo
            echo '```sh'
            echo "dsh plugin --profile web add @cliven/dsh-tmp-wks@${version}"
            echo '```'
            echo
            echo "## 变更"
            echo
            if [ -n "$prev" ]; then
              echo "自 \`${prev}\` 以来的提交："
              echo
              git log --no-merges --pretty='- %s (%h)' "${prev}..${GITHUB_REF_NAME}"
            else
              echo "首个版本。"
            fi
            echo
            echo "## 下载"
            echo
            echo "- \`dsh-tmp-wks.tar.gz\`：含 \`dist/\`、双语文档与 LICENSE，解压即用（不想走 npm 时可下载）。"
            echo "- npm：[\`@cliven/dsh-tmp-wks@${version}\`](https://www.npmjs.com/package/@cliven/dsh-tmp-wks/v/${version})"
          } > RELEASE_NOTES.md

          echo "--- 生成的说明 ---"
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dsh-tmp-wks.tar.gz
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
